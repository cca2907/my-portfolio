<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technical Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --accent: #0d6efd;
        --card-radius: 14px;
      }

      body {
        background-color: #f4f6fb;
      }

      /* ── Header ── */
      header {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        padding: 4rem 1rem;
      }

      /* ── Cards ── */
      .project-card {
        border: none;
        border-radius: var(--card-radius);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .project-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12) !important;
      }

      /* ── Tech badge strip ── */
      .tech-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 1rem;
      }
      .tech-badge {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 3px 10px;
        border-radius: 20px;
        background: #e8f0fe;
        color: var(--accent);
        border: 1px solid #c2d4fd;
      }

      /* ── Skeleton loader ── */
      .skeleton {
        background: linear-gradient(90deg, #e2e8f0 25%, #edf2f7 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 6px;
      }
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .skeleton-card {
        border-radius: var(--card-radius);
        overflow: hidden;
        background: #fff;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        height: 220px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ── Error state ── */
      .error-box {
        border: 2px dashed #f87171;
        border-radius: var(--card-radius);
        padding: 2.5rem;
        text-align: center;
        color: #b91c1c;
        background: #fff5f5;
      }

      footer { padding-bottom: 2.5rem; }
    </style>
  </head>
  <body>

    <!-- Header -->
    <header class="text-white text-center shadow-sm">
      <div class="container">
        <h1 id="user-name" class="fw-bold fs-1 mb-2">
          <span class="skeleton d-inline-block" style="width:240px;height:2rem;"></span>
        </h1>
        <p id="user-title" class="lead mb-0" style="color:#94a3b8;"></p>
        <p id="title-description" class="lead mb-0" style="color:#94a3b8; font-size: 0.75em; font-style: italic;"></p>
      </div>
    </header>

    <!-- Projects -->
    <main class="container my-5">
      <h2 class="text-center mb-5 fw-bold">My Projects</h2>
      <div id="projects-container" class="row g-4">
        <!-- Skeleton placeholders (replaced on load) -->
        <div class="col-md-4"><div class="skeleton-card"><div class="skeleton" style="height:1rem;width:60%;"></div><div class="skeleton" style="height:.75rem;width:90%;"></div><div class="skeleton" style="height:.75rem;width:80%;"></div></div></div>
        <div class="col-md-4"><div class="skeleton-card"><div class="skeleton" style="height:1rem;width:55%;"></div><div class="skeleton" style="height:.75rem;width:85%;"></div><div class="skeleton" style="height:.75rem;width:70%;"></div></div></div>
        <div class="col-md-4"><div class="skeleton-card"><div class="skeleton" style="height:1rem;width:65%;"></div><div class="skeleton" style="height:.75rem;width:88%;"></div><div class="skeleton" style="height:.75rem;width:75%;"></div></div></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="text-center">
      <hr class="w-25 mx-auto mb-4" />
      <p class="text-muted mb-1">
        Last Sync: <span id="sync-time" class="fw-bold text-primary">—</span>
      </p>
      <p class="text-muted" style="font-size:0.75rem;">
        Data served via Google Apps Script Cache Engine
      </p>
    </footer>

    <script>
      const API_URL =
        "https://script.google.com/macros/s/AKfycbxbcCTCcpsD27eWJm4ZVieyOSeFwRq4IfUY880KOXdaVR_7wM_EHMcawjmF43-D-SC8/exec";

      // ── Popup config (hardcoded) ─────────────────────────────────────────
      const POPUP = { w: 1024, h: 576 };

      function openLink(url) {
        const left = (screen.width  / 2) - (POPUP.w / 2);
        const top  = (screen.height / 2) - (POPUP.h / 2);
        window.open(
          url,
          "Evidence",
          `width=${POPUP.w},height=${POPUP.h},top=${top},left=${left},resizable=yes,scrollbars=yes`
        );
      }

      // ── Safe text helper (prevents XSS) ──────────────────────────────────
      function safeText(str) {
        const div = document.createElement("div");
        div.textContent = str ?? "";
        return div.innerHTML;           // entities-escaped, safe to inject
      }

      // ── Build one project card (safe) ────────────────────────────────────
      function buildCard(proj) {
        // Split comma-separated tech into individual badges
        const techBadges = (proj.tech ?? "")
          .split(",")
          .map(t => t.trim())
          .filter(Boolean)
          .map(t => `<span class="tech-badge">${safeText(t)}</span>`)
          .join("");

        const linkButton = proj.link
          ? `<button onclick="openLink('${safeText(proj.link)}')"
               class="btn btn-primary btn-sm mt-auto w-100">View Project</button>`
          : "";

        return `
          <div class="col-md-4 mb-2">
            <div class="card project-card h-100 shadow-sm p-2">
              <div class="card-body d-flex flex-column p-4">
                <h5 class="card-title fw-bold text-dark mb-3">${safeText(proj.title)}</h5>
                <p class="card-text text-muted small flex-grow-1">${safeText(proj.description)}</p>
                <div class="tech-badges">${techBadges}</div>
                ${linkButton}
              </div>
            </div>
          </div>`;
      }

      // ── Render error inside the projects container ───────────────────────
      function showProjectsError(message) {
        document.getElementById("projects-container").innerHTML = `
          <div class="col-12">
            <div class="error-box">
              <p class="fw-bold mb-1">⚠️ Could not load projects</p>
              <p class="mb-0 small text-muted">${safeText(message)}</p>
            </div>
          </div>`;
      }

      // ── Main fetch ───────────────────────────────────────────────────────
      async function loadData() {
        // Timeout: abort after 10 seconds
        const controller = new AbortController();
        const timeoutId  = setTimeout(() => controller.abort(), 10_000);

        try {
          const response = await fetch(API_URL, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();

          // ── Profile ──
          document.getElementById("user-name").textContent  = data.settings?.name  ?? "Portfolio";
          document.getElementById("user-title").textContent = data.settings?.title ?? "";
          document.getElementById("title-description").textContent = data.settings?.titleDescription ?? "";
          document.getElementById("sync-time").textContent  = data.lastSync         ?? "Unknown";

          // ── Projects — build all HTML first, then inject once ──
          const container = document.getElementById("projects-container");

          if (!Array.isArray(data.projects) || data.projects.length === 0) {
            container.innerHTML = `<p class="text-center text-muted">No projects found.</p>`;
            return;
          }

          container.innerHTML = data.projects.map(buildCard).join("");

        } catch (err) {
          clearTimeout(timeoutId);
          console.error("Portfolio load error:", err);

          // Header fallback
          const nameEl = document.getElementById("user-name");
          if (nameEl.querySelector(".skeleton")) nameEl.textContent = "Portfolio";

          document.getElementById("sync-time").textContent = "Unavailable";

          // Friendly project area error
          const isTimeout = err.name === "AbortError";
          showProjectsError(
            isTimeout
              ? "The request timed out. Please check your connection and refresh."
              : err.message || "An unexpected error occurred."
          );
        }
      }

      loadData();
    </script>
  </body>
</html>
