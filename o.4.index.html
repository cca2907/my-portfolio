<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technical Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --accent: #0d6efd;
        --card-radius: 14px;
      }

      body {
        background-color: #f4f6fb;
      }

      /* ── Header ── */
      header {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        padding: 4rem 1rem;
      }

      /* ── Cards ── */
      .project-card {
        border: none;
        border-radius: var(--card-radius);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .project-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12) !important;
      }

      /* ── Tech badge strip ── */
      .tech-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 1rem;
      }
      .tech-badge {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 3px 10px;
        border-radius: 20px;
        background: #e8f0fe;
        color: var(--accent);
        border: 1px solid #c2d4fd;
      }

      /* ── Skeleton loader ── */
      .skeleton {
        background: linear-gradient(90deg, #e2e8f0 25%, #edf2f7 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 6px;
      }
      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .skeleton-card {
        border-radius: var(--card-radius);
        overflow: hidden;
        background: #fff;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        height: 220px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* ── Error state ── */
      .error-box {
        border: 2px dashed #f87171;
        border-radius: var(--card-radius);
        padding: 2.5rem;
        text-align: center;
        color: #b91c1c;
        background: #fff5f5;
      }

    /* Custom status badges and styles */
    .section-title {
        margin-top: 3rem;
        margin-bottom: 1.5rem;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid #e2e8f0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 1.1rem;
    }

    /* Experimental Card Look */
    .project-card.testing, .project-card.exploration {
        border: 1px dashed var(--accent) !important;
        background-color: rgba(13, 110, 253, 0.02);
    }

    .status-indicator {
        font-size: 0.65rem;
        text-transform: uppercase;
        padding: 2px 8px;
        border-radius: 4px;
        margin-bottom: 8px;
        display: inline-block;
        font-weight: bold;
    }
    .status-production { background: #dcfce7; color: #166534; }
    .status-testing { background: #fef9c3; color: #854d0e; }
    .status-exploration { background: #f3e8ff; color: #6b21a8; }

      footer { padding-bottom: 2.5rem; }
    </style>
  </head>
  <body>

    <!-- Header -->
    <header class="text-white text-center shadow-sm">
      <div class="container">
        <h1 id="user-name" class="fw-bold fs-1 mb-2">
          <span class="skeleton d-inline-block" style="width:240px;height:2rem;"></span>
        </h1>
        <p id="user-title" class="lead mb-0" style="color:#94a3b8;"></p>
        <p id="title-description" class="lead mb-0" style="color:#F6F6F6; font-size: 0.75em; font-style: italic;"></p>
      </div>
    </header>

    <!-- Projects -->
    <main class="container my-5">
    <div id="dynamic-sections">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Architecting the interface...</p>
        </div>
    </div>
    </main>

    <!-- Footer -->
    <footer class="text-center">
      <hr class="w-25 mx-auto mb-4" />
      <p class="text-muted mb-1">
        Last Sync: <span id="sync-time" class="fw-bold text-primary">—</span>
      </p>
      <p class="text-muted" style="font-size:0.75rem;">
        Data served via Google Apps Script Cache Engine
      </p>
    </footer>

    <script>

        const API_URL = "https://script.google.com/macros/s/AKfycbxbcCTCcpsD27eWJm4ZVieyOSeFwRq4IfUY880KOXdaVR_7wM_EHMcawjmF43-D-SC8/exec";
        const POPUP = { w: 1024, h: 576 };

        function openLink(url) {
            const left = (screen.width / 2) - (POPUP.w / 2);
            const top = (screen.height / 2) - (POPUP.h / 2);
            window.open(url, "Evidence", `width=${POPUP.w},height=${POPUP.h},top=${top},left=${left},resizable=yes,scrollbars=yes`);
        }

        function safeText(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        // Logic para sa kulay ng status
        function getStatusClass(status) {
            const s = String(status).toLowerCase();
            if (s.includes("production")) return "status-production";
            if (s.includes("testing")) return "status-testing";
            if (s.includes("exploration")) return "status-exploration";
            return "bg-secondary text-white";
        }

        function buildCard(proj) {
            const techBadges = (proj.tech ?? "").split(",").map(t => t.trim()).filter(Boolean)
                .map(t => `<span class="tech-badge">${safeText(t)}</span>`).join("");

            const statusClass = getStatusClass(proj.status);
            const cardExtraClass = String(proj.status).toLowerCase();

            return `
            <div class="col-md-4 mb-3">
                <div class="card project-card h-100 shadow-sm p-2 ${cardExtraClass}">
                <div class="card-body d-flex flex-column p-4">
                    <div class="status-indicator ${statusClass}">${safeText(proj.status)}</div>
                    <h5 class="card-title fw-bold text-dark mb-3">${safeText(proj.title)}</h5>
                    <p class="card-text text-muted small flex-grow-1">${safeText(proj.description)}</p>
                    <div class="tech-badges">${techBadges}</div>
                    ${proj.link ? `<button onclick="openLink('${safeText(proj.link)}')" class="btn btn-primary btn-sm mt-auto w-100">View Project</button>` : ''}
                </div>
                </div>
            </div>`;
        }

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                // 1. Update Profile Settings
                document.getElementById("user-name").textContent = data.settings?.name ?? "Portfolio";
                document.getElementById("user-title").textContent = data.settings?.title ?? "";
                document.getElementById("title-description").textContent = data.settings?.titleDescription ?? "";
                document.getElementById("sync-time").textContent = data.lastSync ?? "Unknown";

                // 2. Group Projects by Status (Column E)
                const grouped = data.projects.reduce((acc, proj) => {
                    const status = proj.status || "Other";
                    if (!acc[status]) acc[status] = [];
                    acc[status].push(proj);
                    return acc;
                }, {});

                // 3. Define Priority and Render
                const priority = ["Production", "Testing", "Exploration"];
                const container = document.getElementById("dynamic-sections");
                container.innerHTML = ""; // Clear loader

                // Sort existing statuses based on priority list
                const sortedStatuses = Object.keys(grouped).sort((a, b) => {
                    let indexA = priority.indexOf(a);
                    let indexB = priority.indexOf(b);
                    if (indexA === -1) indexA = 99;
                    if (indexB === -1) indexB = 99;
                    return indexA - indexB;
                });

                sortedStatuses.forEach(status => {
                    const sectionHtml = `
                        <div class="section-container mb-5">
                            <h2 class="section-title fw-bold text-primary">${status}</h2>
                            <div class="row g-4">
                                ${grouped[status].map(buildCard).join("")}
                            </div>
                        </div>
                    `;
                    container.innerHTML += sectionHtml;
                });

            } catch (err) {
                console.error("Error:", err);
                document.getElementById("dynamic-sections").innerHTML = `<div class="alert alert-danger">Failed to load projects.</div>`;
            }
        }

        loadData();

    </script>
  </body>
</html>
